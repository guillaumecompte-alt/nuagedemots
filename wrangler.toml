name = "nuagedemots"
main = "src/worker.js"
compatibility_date = "2026-10-19"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "ACTIVITIES"
class_name = "ActivityStore"

[exports.ActivityStore]
type = "durable-object"
storage = "sqlite"
